<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Eugene Clent | Software Developer &amp; Computer Science Student</title>
    <meta
      name="description"
      content="Portfolio of Eugene Clent, a Computer Science student and aspiring software engineer building modern web, mobile, and intelligent technology solutions."
    />
    <meta name="author" content="Eugene Clent" />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social sharing -->
    <!-- After deploying, replace the image paths with absolute URLs (https://your-domain/og-image.png)
         and add: <link rel="canonical" href="https://your-domain/" /> and <meta property="og:url" ...> -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eugene Clent" />
    <meta property="og:title" content="Eugene Clent | Software Developer & Computer Science Student" />
    <meta
      property="og:description"
      content="Portfolio of Eugene Clent, a Computer Science student and aspiring software engineer building modern web, mobile, and intelligent technology solutions."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Eugene Clent — Building technology for real-world problems" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eugene Clent | Software Developer & Computer Science Student" />
    <meta
      name="twitter:description"
      content="Computer Science student and aspiring software engineer building modern web, mobile, and intelligent technology solutions."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Eugene Clent",
        "jobTitle": "Software Developer",
        "description": "Computer Science student and aspiring software engineer building modern web, mobile, and intelligent technology solutions.",
        "address": { "@type": "PostalAddress", "addressCountry": "GH" },
        "knowsAbout": ["React", "React Native", "Node.js", "Firebase", "Mobile Development", "Web Development"]
      }
    </script>

    <!-- Fonts: preconnect + display=swap so text is never blocked -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Sora:wght@500;600;700&display=swap"
    />
    <!-- Warm up the connection to Spline's CDN so the 3D scene downloads sooner -->
    <link rel="preconnect" href="https://prod.spline.design" crossorigin />

    <!-- Loading screen styles (inline so it paints before any JS/CSS downloads) -->
    <style>
      html { background: #05060a; }
      #boot {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: #05060a; color: #eef1f7; transition: opacity .5s ease, visibility .5s ease;
        animation: boot-failsafe 0s 6s forwards;
      }
      #boot.is-done { opacity: 0; visibility: hidden; }
      .boot__inner { display: grid; justify-items: center; gap: 18px; }
      .boot__mark {
        font: 700 44px/1 Sora, system-ui, sans-serif; letter-spacing: -0.04em;
        background: linear-gradient(120deg, #8fb4ff, #b49cff); -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot__bar { width: 120px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
      .boot__bar::after {
        content: ""; display: block; width: 40%; height: 100%;
        background: linear-gradient(90deg, transparent, #4f8cff, #8b5cf6, transparent);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot__name { font: 500 11px/1 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .3em; text-transform: uppercase; color: #a1a9bb; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes boot-pulse { 50% { opacity: .65; } }
      @keyframes boot-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .boot__mark, .boot__bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Eugene Clent's portfolio">
      <div class="boot__inner" aria-hidden="true">
        <div class="boot__mark">EC</div>
        <div class="boot__bar"></div>
        <div class="boot__name">Eugene Clent</div>
      </div>
    </div>
    <noscript>
      <style>#boot { display: none; }</style>
      <p style="padding: 24px; color: #eef1f7; font-family: system-ui">
        Eugene Clent — Computer Science student and software developer. Please enable JavaScript to view this portfolio.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
